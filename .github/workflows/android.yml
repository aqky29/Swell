name: Android Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI (arm64-v8a for single ABI, or all for all ABIs + universal)'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - all

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v4

    - name: Setup Secrets (Keystore & local.properties)
      env:
        LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "LASTFM_API_KEY=${LASTFM_API_KEY}" > local.properties
        echo "LASTFM_SECRET=${LASTFM_SECRET}" >> local.properties

        if [ -n "${KEYSTORE_BASE64}" ]; then
          echo "${KEYSTORE_BASE64}" | base64 -d > swell-release.jks
          {
            echo "storeFile=swell-release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "Release keystore configured."
        else
          echo "No KEYSTORE_BASE64 secret set; falling back to debug signing key."
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

    - name: Build Prod Release APK
      env:
        TARGET_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      run: |
        if [ "${TARGET_ABI}" = "all" ]; then
          ./gradlew :app:assembleProdRelease :wearos:assembleProdRelease
        else
          ./gradlew :app:assembleProdRelease -Pswell.abi="${TARGET_ABI}"
        fi
        ls -lh app/build/outputs/apk/prod/release/*.apk

    - name: Upload Phone Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: swell-prod-release-${{ inputs.abi || 'arm64-v8a' }}
        path: app/build/outputs/apk/prod/release/*.apk

    - name: Upload Wear OS APK Artifact
      if: ${{ (inputs.abi || 'arm64-v8a') == 'all' }}
      uses: actions/upload-artifact@v4
      with:
        name: swell-wear-prod-release
        path: wearos/build/outputs/apk/prod/release/*.apk
